document_type: "generic"
title: "Generic / Unclassified Document"
description: "Fallback schema for arbitrary documents extracting discovered key-value pairs and tables"
version: "1.0"

classification:
  title_keywords: []
  keywords: []
  required_anchors: []
  min_score_threshold: 0.0

sections:
  - "extracted_fields"

fields:
