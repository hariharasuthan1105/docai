document_type: "tractor_invoice"
title: "Agricultural Tractor Commercial Tax Invoice"
description: "Tax invoices and sales certificates for commercial tractors and agricultural machinery"
version: "1.0"

classification:
  title_keywords:
    - "tax invoice"
    - "quotation"
    - "commercial invoice"
    - "tractor"
  keywords:
    - "tractor"
    - "horse power"
    - "hp"
    - "engine power"
    - "dealer"
    - "authorised dealer"
    - "chassis no"
    - "engine no"
    - "asset cost"
    - "mahindra"
    - "swaraj"
    - "john deere"
    - "farmtrac"
    - "sonalika"
    - "escorts"
    - "tafe"
  required_anchors:
    - "horse power"
  table_indicators:
    - "description of equipment"
    - "sl no"
  min_score_threshold: 0.30

sections:
  - "dealer"
  - "equipment"
  - "financials"
  - "metadata"
  - "customer"

fields:
  dealer_name:
    section: "dealer"
    aliases:
      - "authorised dealer"
      - "authorized dealer"
      - "dealer name"
      - "dealer"
      - "m/s"
    type: "string"
    required: true
    extraction_strategies: ["entity_match", "key_value", "regex"]
    confidence_weight: 1.0

  model_name:
    section: "equipment"
    aliases:
      - "model name"
      - "tractor model"
      - "model"
      - "description of equipment"
      - "item description"
    type: "string"
    required: true
    extraction_strategies: ["entity_match", "key_value", "regex"]
    confidence_weight: 1.0

  horse_power:
    section: "equipment"
    aliases:
      - "horse power"
      - "engine power"
      - "power"
      - "hp"
    type: "number"
    required: true
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:horse\\s*power|engine\\s*power|power|hp)\\s*[:\\-]\\s*(\\d{1,3}(?:\\.\\d+)?)\\s*(?:h\\.?p\\.?|hp)?"
      - "(\\d{1,3}(?:\\.\\d+)?)\\s*(?:h\\.?\\s*p\\.?|hp)\\b"
    min_value: 5.0
    max_value: 150.0
    confidence_weight: 1.0

  asset_cost:
    section: "financials"
    aliases:
      - "asset cost"
      - "total cost"
      - "grand total"
      - "invoice total"
      - "total amount"
      - "total (₹)"
      - "amount payable"
    type: "currency"
    required: true
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:asset\\s*cost|total\\s*cost|grand\\s*total|invoice\\s*total|total\\s*amount|total\\s*\\([^)]*\\)?)\\s*[:\\-]?\\s*(?:rs\\.?|inr|₹)?\\s*([\\d,]+(?:\\.\\d{1,2})?)"
    min_value: 50000.0
    max_value: 50000000.0
    confidence_weight: 1.0

  invoice_number:
    section: "metadata"
    aliases:
      - "invoice no"
      - "invoice number"
      - "bill no"
      - "inv no"
      - "invoice #"
    type: "string"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:invoice\\s*(?:no\\.?|num\\.?|number|#)|bill\\s*(?:no\\.?|number)|inv\\s*no\\.?)\\s*[:\\-]?\\s*([a-zA-Z0-9\\-\\/]+)"
    confidence_weight: 0.9

  invoice_date:
    section: "metadata"
    aliases:
      - "invoice date"
      - "bill date"
      - "dated"
      - "date"
    type: "date"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:date|dated|invoice\\s*date)\\s*[:\\-]?\\s*(\\d{1,2}[\\/\\-\\.]\\d{1,2}[\\/\\-\\.]\\d{2,4})"
    confidence_weight: 0.9

  customer_name:
    section: "customer"
    aliases:
      - "customer name"
      - "buyer name"
      - "buyer"
      - "bill to"
      - "purchaser"
    type: "string"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:customer\\s*name|buyer\\s*name|buyer|bill\\s*to|purchaser)\\s*[:\\-]?\\s*(.+)"
    confidence_weight: 0.85

  customer_address:
    section: "customer"
    aliases:
      - "customer address"
      - "buyer address"
      - "address"
    type: "string"
    required: false
    extraction_strategies: ["key_value", "regex"]
    confidence_weight: 0.8

  phone_number:
    section: "customer"
    aliases:
      - "phone"
      - "mobile"
      - "contact no"
      - "tel"
    type: "phone"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:phone|mobile|mob|contact|tel)\\s*(?:no\\.?|number)?\\s*[:\\-]?\\s*(?:\\+91[\\-\\s]?)?([6-9]\\d{9})\\b"
    confidence_weight: 0.85

  registration_number:
    section: "vehicle"
    aliases:
      - "registration no"
      - "reg no"
      - "chassis no"
    type: "string"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:reg(?:istration)?\\s*no\\.?|chassis\\s*no\\.?)\\s*[:\\-]?\\s*([A-Z]{2}[0-9\\s\\-]{1,3}[A-Z]{0,3}[0-9]{3,4})"
    confidence_weight: 0.8

  serial_number:
    section: "vehicle"
    aliases:
      - "serial no"
      - "sl no"
      - "engine no"
      - "tractor serial no"
    type: "string"
    required: false
    extraction_strategies: ["key_value", "regex"]
    regex_patterns:
      - "(?:serial\\s*no\\.?|sl\\.?\\s*no\\.?|engine\\s*no\\.?|tractor\\s*serial\\s*no\\.?)\\s*[:\\-]?\\s*([a-zA-Z0-9\\-\\/]+)"
    confidence_weight: 0.8

validations:
  - name: "horse_power_range"
    rule_type: "range_check"
    expression: "horse_power >= 5.0 and horse_power <= 150.0"
    severity: "error"
    message: "Horse Power is outside valid equipment range [5, 150] HP."

  - name: "asset_cost_range"
    rule_type: "range_check"
    expression: "asset_cost >= 50000.0 and asset_cost <= 50000000.0"
    severity: "error"
    message: "Asset Cost is outside plausible commercial range [₹50,000, ₹50,000,000]."

auto_approve_threshold: 0.88
review_threshold: 0.70
