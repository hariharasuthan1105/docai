document_type: "tractor_invoice"
title: "Agricultural Tractor Commercial Tax Invoice"
description: "Tax invoices and sales certificates for commercial tractors and agricultural machinery"
version: "1.0"

classification:
  title_keywords:
    - "tax invoice"
    - "quotation"
    - "commercial invoice"
    - "tractor"
  keywords:
    - "tractor"
    - "horse power"
    - "hp"
    - "engine power"
    - "dealer"
    - "authorised dealer"
    - "chassis no"
    - "engine no"
    - "asset cost"
    - "mahindra"
    - "swaraj"
    - "john deere"
    - "farmtrac"
    - "sonalika"
    - "escorts"
    - "tafe"
  required_anchors:
    - "horse power"
  table_indicators:
    - "description of equipment"
    - "sl no"
  min_score_threshold: 0.30

sections:
  - "dealer"
  - "equipment"
  - "financials"
  - "metadata"
  - "customer"

# Schema-driven visual marks (replaces hardcoded dealer_signature/dealer_stamp)
vision:
  marks:
    - name: signature
      mark_type: signature
      label: "Dealer Signature"
    - name: stamp
      mark_type: stamp
      label: "Dealer Stamp"

# Schema-driven table stop keywords (replaces hardcoded list in table_detector.py)
stop_keywords:
  - "subtotal"
  - "sub total"
  - "grand total"
  - "taxable"
  - "cgst"
  - "sgst"
  - "discount"
  - "total"
  - "thank you"
  - "authorized signatory"
  - "authorised signatory"
  - "for "

